<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Premnathrail Portal</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: "Segoe UI", sans-serif; background: #f5f6f8; color: #1f2937; }
  .card { max-width: 520px; background: #fff; border-radius: 12px; padding: 32px;
          box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.5; margin: 8px 0; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; word-break: break-all; }
  button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 999px;
           background: #1d4ed8; color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>Can't reach the portal</h1>
  <p id="reason"></p>
  <p>How to fix: check your internet / office network connection. If other sites work, the server may be
     restarting after an update — wait a minute and retry.</p>
  <button onclick="location.replace(params.get('url'))">Retry</button>
</div>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('reason').innerHTML =
    'Could not load <code></code> — <b></b>'
  document.querySelector('#reason code').textContent = params.get('url')
  document.querySelector('#reason b').textContent = params.get('error') || 'unknown error'
</script>
</body>
</html>
